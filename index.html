<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>manon-metre</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0f;
      --panel: #17181c;
      --chrome: #2a2b32;
      --accent: #e8c840;
      --red: #e84040;
      --green: #40e880;
      --text: #f0ede0;
      --dim: #6b6a60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      color: var(--text);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,.015) 40px, rgba(255,255,255,.015) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,.015) 40px, rgba(255,255,255,.015) 41px);
      pointer-events: none;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      letter-spacing: .5em;
      color: var(--dim);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .brand span { color: var(--accent); }

    .instrument {
      background: var(--panel);
      border: 3px solid var(--chrome);
      border-radius: 50%;
      padding: 20px;
      box-shadow:
        0 0 0 6px #111,
        0 0 0 8px #333,
        0 0 60px rgba(0,0,0,.8),
        inset 0 0 30px rgba(0,0,0,.5);
    }

    svg#gauge { display: block; }

    .digital {
      background: #080b08;
      border: 2px solid #2a3a2a;
      border-radius: 6px;
      padding: 6px 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--green);
      text-align: center;
      letter-spacing: .1em;
      box-shadow: inset 0 0 20px rgba(64,232,128,.08), 0 0 10px rgba(64,232,128,.15);
      min-width: 160px;
      text-shadow: 0 0 12px rgba(64,232,128,.7);
      margin-top: -10px;
      position: relative;
      z-index: 2;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 16px;
    }

    .btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: none;
      font-size: 2rem;
      font-family: 'Bebas Neue', sans-serif;
      cursor: pointer;
      transition: transform .08s, box-shadow .08s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-minus {
      background: radial-gradient(circle at 40% 35%, #c03030, #6a1010);
      color: #fff;
      box-shadow: 0 4px 0 #3a0808, 0 6px 20px rgba(200,50,50,.4);
    }
    .btn-plus {
      background: radial-gradient(circle at 40% 35%, #50c870, #0f5a20);
      color: #fff;
      box-shadow: 0 4px 0 #083a18, 0 6px 20px rgba(50,200,80,.4);
    }
    .btn:active { transform: translateY(3px); }
    .btn-minus:active { box-shadow: 0 1px 0 #3a0808 !important; }
    .btn-plus:active  { box-shadow: 0 1px 0 #083a18 !important; }

    .status {
      font-size: .7rem;
      color: var(--dim);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-top: 10px;
    }
    .status.synced  { color: var(--green); }
    .status.syncing { color: var(--accent); }
    .status.error   { color: var(--red); }

    #needle {
      transform-origin: 200px 200px;
      transition: transform .5s cubic-bezier(.34,1.56,.64,1);
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="brand">manon<span>·</span>metre</div>

  <div class="instrument">
    <svg id="gauge" width="320" height="320" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="face" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#23252e"/>
          <stop offset="100%" stop-color="#0e0f12"/>
        </radialGradient>
        <linearGradient id="ndl" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f5c040"/>
          <stop offset="50%" stop-color="#e8c840"/>
          <stop offset="100%" stop-color="#a08020"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#555"/>
          <stop offset="50%" stop-color="#999"/>
          <stop offset="100%" stop-color="#333"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <circle cx="200" cy="200" r="190" fill="url(#rim)" />
      <circle cx="200" cy="200" r="185" fill="#1a1b1f" />
      <circle cx="200" cy="22"  r="6" fill="#111" stroke="#444" stroke-width="1.5"/>
      <circle cx="200" cy="378" r="6" fill="#111" stroke="#444" stroke-width="1.5"/>
      <circle cx="22"  cy="200" r="6" fill="#111" stroke="#444" stroke-width="1.5"/>
      <circle cx="378" cy="200" r="6" fill="#111" stroke="#444" stroke-width="1.5"/>
      <circle cx="200" cy="200" r="170" fill="url(#face)" />

      <!-- Zones colorées -->
      <path id="zoneGreen"  fill="none" stroke="#154a25" stroke-width="20" opacity=".75"/>
      <path id="zoneOrange" fill="none" stroke="#5a3c08" stroke-width="20" opacity=".75"/>
      <path id="zoneRed"    fill="none" stroke="#6a1010" stroke-width="20" opacity=".75"/>
      <!-- Arc track de fond -->
      <path id="arcTrack" fill="none" stroke="#111316" stroke-width="20"/>
      <!-- Arc progression -->
      <path id="arcFill" fill="none" stroke="#e8c840" stroke-width="5" stroke-linecap="round" opacity=".9"/>

      <!-- Ticks & labels générés en JS -->
      <g id="ticks"></g>
      <g id="labels" font-family="'Share Tech Mono', monospace" text-anchor="middle" dominant-baseline="middle"></g>

      <circle cx="200" cy="200" r="22" fill="#060708"/>

      <g id="needle">
        <polygon points="200,50 196,200 204,200" fill="url(#ndl)" filter="url(#glow)"/>
        <polygon points="200,222 197,200 203,200" fill="#c03030"/>
      </g>

      <circle cx="200" cy="200" r="14" fill="#c8a030" />
      <circle cx="200" cy="200" r="10" fill="#e8c840" />
      <circle cx="200" cy="200" r="5"  fill="#a07820" />

      <text x="200" y="290" text-anchor="middle" font-family="'Bebas Neue', sans-serif"
        font-size="13" fill="#3a3a30" letter-spacing="5">MANON·METRE</text>
      <text x="200" y="158" text-anchor="middle" font-family="'Share Tech Mono', monospace"
        font-size="11" fill="#555">SCORE</text>
    </svg>
  </div>

  <div class="digital" id="display">--</div>

  <div class="controls">
    <button class="btn btn-minus" id="btnMinus">−</button>
    <button class="btn btn-plus"  id="btnPlus">+</button>
  </div>

  <div class="status" id="status">connexion...</div>
</div>

<script type="module">
  // ── Imports Firebase depuis CDN ────────────────────────────────
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ── Config (remplace apiKey si tu en génères une nouvelle) ────
  const firebaseConfig = {
    apiKey:            "AIzaSyDGm-2BIn32uH5t17hQzwRqbT5T75vpTfw",
    authDomain:        "manon-metre.firebaseapp.com",
    databaseURL:       "https://manon-metre-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "manon-metre",
    storageBucket:     "manon-metre.firebasestorage.app",
    messagingSenderId: "556156241308",
    appId:             "1:556156241308:web:3fadea39470b2483faf459"
  };

  // ── Constantes jauge ──────────────────────────────────────────
  const MIN = 0, MAX = 100;
  const START = -220, SWEEP = 260;
  const R = 148, R_T = 156;
  const CX = 200, CY = 200;
  let cur = 0;

  const ns = "http://www.w3.org/2000/svg";
  const rad = d => d * Math.PI / 180;
  const pt  = (a, r) => ({ x: CX + r * Math.cos(rad(a)), y: CY + r * Math.sin(rad(a)) });

  function arcD(f1, f2, r) {
    if (f2 <= f1) return '';
    const a1 = START + f1 * SWEEP, a2 = START + f2 * SWEEP;
    const p1 = pt(a1, r), p2 = pt(a2, r);
    return `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${(f2-f1)*SWEEP>180?1:0} 1 ${p2.x} ${p2.y}`;
  }

  function buildGauge() {
    document.getElementById('arcTrack')  .setAttribute('d', arcD(0, 1,    R));
    document.getElementById('zoneRed')   .setAttribute('d', arcD(0, 0.40, R));
    document.getElementById('zoneOrange').setAttribute('d', arcD(0.40, 0.60, R));
    document.getElementById('zoneGreen') .setAttribute('d', arcD(0.60, 1,   R));

    const tG = document.getElementById('ticks');
    const lG = document.getElementById('labels');
    tG.innerHTML = lG.innerHTML = '';

    // 50 petits ticks (un tous les 2 points), 10 grands ticks (un tous les 10 points)
    for (let i = 0; i <= 50; i++) {
      const f = i / 50;
      const a = START + f * SWEEP;
      const isMaj = (i % 5 === 0);
      const p1 = pt(a, R_T), p2 = pt(a, isMaj ? R_T - 22 : R_T - 10);
      const ln = document.createElementNS(ns, 'line');
      ln.setAttribute('x1', p1.x); ln.setAttribute('y1', p1.y);
      ln.setAttribute('x2', p2.x); ln.setAttribute('y2', p2.y);
      ln.setAttribute('stroke',        isMaj ? '#ccc' : '#3a3a45');
      ln.setAttribute('stroke-width',  isMaj ? '2.5'  : '1');
      ln.setAttribute('stroke-linecap','round');
      tG.appendChild(ln);

      if (isMaj) {
        const v  = Math.round(f * MAX);
        const lp = pt(a, R_T - 38);
        const tx = document.createElementNS(ns, 'text');
        tx.setAttribute('x', lp.x); tx.setAttribute('y', lp.y);
        tx.setAttribute('font-size', '13');
        tx.setAttribute('font-weight', 'bold');
        tx.setAttribute('fill', v >= 60 ? '#60a060' : v <= 40 ? '#c06060' : '#888');
        tx.textContent = v;
        lG.appendChild(tx);
      }
    }
  }

  function updateUI(val) {
    cur = Math.max(MIN, Math.min(MAX, val));
    const f = (cur - MIN) / (MAX - MIN);
    const a = START + f * SWEEP;

    document.getElementById('needle') .style.transform = `rotate(${a + 90}deg)`;
    document.getElementById('arcFill').setAttribute('d', arcD(0, f, R));

    const d = document.getElementById('display');
    d.textContent = String(cur).padStart(3, '0');
    if (cur <= 20) {
      d.style.color = '#e84040'; d.style.textShadow = '0 0 12px rgba(232,64,64,.8)';
    } else if (cur >= 80) {
      d.style.color = '#40e880'; d.style.textShadow = '0 0 12px rgba(64,232,128,.7)';
    } else {
      d.style.color = '#40e880'; d.style.textShadow = '0 0 12px rgba(64,232,128,.7)';
    }
  }

  function status(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg; el.className = 'status ' + (cls || '');
  }

  buildGauge();
  updateUI(0);

  // ── Firebase ──────────────────────────────────────────────────
  let scoreRef = null;
  try {
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    scoreRef  = ref(db, 'score');

    onValue(scoreRef, snap => {
      const v = snap.val();
      if (v !== null) { updateUI(v); status('● synchronisé', 'synced'); }
      else set(scoreRef, 0);
    }, err => { console.error(err); status('⚠ erreur connexion', 'error'); });

    status('connexion...', 'syncing');
  } catch(e) {
    console.error(e);
    status('⚠ config Firebase manquante', 'error');
    updateUI(parseInt(localStorage.getItem('manon_score') || '0'));
  }

  // ── Boutons ───────────────────────────────────────────────────
  function change(delta) {
    const nv = Math.max(MIN, Math.min(MAX, cur + delta));
    updateUI(nv);
    if (scoreRef) {
      status('envoi...', 'syncing');
      set(scoreRef, nv)
        .then(() => status('● synchronisé', 'synced'))
        .catch(() => { status('⚠ erreur sauvegarde', 'error'); localStorage.setItem('manon_score', nv); });
    } else {
      localStorage.setItem('manon_score', nv);
      status('● local uniquement', '');
    }
  }

  document.getElementById('btnMinus').addEventListener('click', () => change(-5));
  document.getElementById('btnPlus') .addEventListener('click', () => change(+5));
</script>

</body>
</html>
